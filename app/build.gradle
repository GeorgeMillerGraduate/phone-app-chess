plugins { id 'com.android.application' }
android {
 namespace 'com.jengacode.kingfischer'
 compileSdk 36
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'com.jengacode.kingfischer'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.2' }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 testOptions { unitTests.returnDefaultValues = true }
 androidResources { noCompress += 'nnue' }
}
dependencies {
 implementation 'androidx.activity:activity:1.10.1'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 testImplementation 'junit:junit:4.13.2'
}
